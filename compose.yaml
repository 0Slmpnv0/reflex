services:
  backend:
    build: ./backend
    command: poetry run fastapi run main.py --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        restart: true
        condition: service_healthy
      redis:
        restart: true
        condition: service_healthy
  db:
    image: postgres
    hostname: pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 10
      start_period: 3s

    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data

volumes:
  db-data: {}
  redis-data: {}
