services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        restart: true
        condition: service_started
  db:
    image: postgres
    hostname: pg
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: test
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: {}
