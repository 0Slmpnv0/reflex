services:
  backend:
    build: ./backend
    command: poetry run fastapi run main.py --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        restart: true
        condition: service_healthy
  db:
    image: postgres
    hostname: pg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 10
      start_period: 3s

    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: {}
